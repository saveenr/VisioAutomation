name: Build

# Builds both development and shipping configurations and runs the PowerShell
# metadata/session checks that do not require Visio. Full COM integration tests
# still need a local Visio installation. See docs/BUILDING.md.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild (Visual Studio 2026)
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '[18.0,19.0)'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # NOTE: the .NET Framework 4.5.2 dev-pack install step is deliberately
      # absent. The shipping libs still target net452, but the reference
      # assemblies are now supplied by the Microsoft.NETFramework.ReferenceAssemblies.net452
      # NuGet package (declared in VisioAutomation_2010/Directory.Packages.props).
      # That package's .targets sets TargetFrameworkRootPath to its own folder,
      # so MSBuild no longer needs the dev pack on disk.

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('VisioAutomation_2010/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore NuGet packages
        run: msbuild VisioAutomation_2010\VisioAutomation2010.slnx -t:Restore

      - name: Build solution
        run: msbuild VisioAutomation_2010\VisioAutomation2010.slnx -p:Configuration=${{ matrix.configuration }} -m

      - name: Test module metadata and runspace isolation (no Visio required)
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -version '[18.0,19.0)' -products '*' -requires Microsoft.Component.MSBuild -latest -property installationPath
          if (-not $vs) { throw 'Visual Studio 2026 was not found.' }
          $vstest = Join-Path $vs 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe'
          & $vstest 'VisioAutomation_2010\VTest.PowerShell\bin\${{ matrix.configuration }}\VTest.PowerShell.dll' /Platform:x64 '/TestCaseFilter:FullyQualifiedName~VTest.PowerShell.ManifestTests|FullyQualifiedName~VTest.PowerShell.SessionTests' '/Logger:trx;LogFileName=module-checks.trx' /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { throw 'Module checks failed.' }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: module-checks-${{ matrix.configuration }}
          path: TestResults/*.trx
          if-no-files-found: ignore
